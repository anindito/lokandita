# Setiap kontainer aplikasi melayani HTTP di port 8080 (KONTRAK.md §9).
<VirtualHost *:8080>
    DocumentRoot /srv/app/public

    <Directory /srv/app/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Semua yang bukan berkas statis ditangani front controller CI4.
        FallbackResource /index.php
    </Directory>

    # Gambar merek dan foto pembuka bawaan: boleh disimpan peramban sehari.
    <Directory /srv/app/public/merek>
        Header set Cache-Control "public, max-age=86400"
        AddType application/manifest+json .webmanifest
    </Directory>

    # Foto unggahan Portal (KONTRAK.md §16). Hanya berkas yang DIBUAT server ada di sini,
    # dengan nama acak. Direktori ini murni statis: mesin PHP dimatikan, tidak ada handler,
    # tidak ada .htaccess, tidak ada daftar isi, dan hanya tiga akhiran gambar yang dijawab.
    # Nama berkasnya tidak pernah dipakai ulang, jadi boleh disimpan peramban selamanya.
    Alias /media /srv/media
    <Directory /srv/media>
        Options -Indexes -ExecCGI -Includes
        AllowOverride None
        php_admin_flag engine off
        SetHandler default-handler
        Require all denied
        <FilesMatch "^[0-9a-f]{32}-[0-9]+\.(avif|webp|jpg)$">
            Require all granted
        </FilesMatch>
        AddType image/avif .avif
        AddType image/webp .webp
        Header always set X-Content-Type-Options "nosniff"
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
